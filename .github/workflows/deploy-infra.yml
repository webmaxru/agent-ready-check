# Re-apply infra/main.bicep from GitHub (for example to bind the custom domain once its CNAME is live, or to change
# the plan), without running anything locally. Same OIDC sign-in as the deploy workflow.
# Set LEAGUE_ADMIN_TOKEN as a production environment secret and LEAGUE_REMOVAL_URL as a production variable.
# The one-time first run (which also creates the GitHub sign-in itself) is infra/deploy.sh in Azure Cloud Shell.
name: Deploy infra

on:
  workflow_dispatch:
    inputs:
      custom_domain:
        description: Custom domain (configure DNS and complete TXT validation first for an apex)
        required: false
        default: isainative.dev
      validation_method:
        description: Apex domains require dns-txt-token
        type: choice
        options: [dns-txt-token, cname-delegation]
        default: dns-txt-token
      swa_sku:
        description: Static Web Apps plan
        type: choice
        options: [Free, Standard]
        default: Free
      browser_runner:
        description: Deploy the browser runner (Container App)
        type: boolean
        default: true
      clear_league_settings:
        description: Clear deployed League moderation settings when the secret/variable is empty
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  bicep:
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Check domain readiness
        if: inputs.custom_domain != ''
        env:
          CUSTOM_DOMAIN: ${{ inputs.custom_domain }}
          VALIDATION_METHOD: ${{ inputs.validation_method }}
        run: |
          set -euo pipefail
          host="$(az staticwebapp show -n "${{ vars.AZURE_STATIC_WEB_APP }}" -g "${{ vars.AZURE_RESOURCE_GROUP }}" --query defaultHostname -o tsv)"
          if [ "$VALIDATION_METHOD" = dns-txt-token ]; then
            ready="$(az staticwebapp hostname list -n "${{ vars.AZURE_STATIC_WEB_APP }}" -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "[?domainName=='$CUSTOM_DOMAIN' && status=='Ready'] | length(@)" -o tsv)"
            [ "$ready" = 1 ] || { echo "::error::Finish TXT ownership validation and HTTPS binding first (docs/PUBLISHING.md)"; exit 1; }
            curl --fail --silent --show-error --max-time 60 "https://$CUSTOM_DOMAIN/api/health" |
              python3 -c 'import json,sys; h=json.load(sys.stdin); assert h.get("runtime") == "azure" and h.get("status") == "ok" and h.get("store") == "azure-blob", "DNS does not reach Agent-Ready Check"'
          else
            cname="$(dig +short CNAME "$CUSTOM_DOMAIN" | sed 's/\.$//')"
            echo "CNAME $CUSTOM_DOMAIN -> ${cname:-missing} (expected $host)" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$cname" = "$host" ] || { echo "::error::Add the DNS-only CNAME record first (docs/PUBLISHING.md)"; exit 1; }
          fi
      - name: Deploy infra/main.bicep
        env:
          LEAGUE_ADMIN_TOKEN: ${{ secrets.LEAGUE_ADMIN_TOKEN }}
          LEAGUE_REMOVAL_URL: ${{ vars.LEAGUE_REMOVAL_URL }}
          CUSTOM_DOMAIN: ${{ inputs.custom_domain }}
          VALIDATION_METHOD: ${{ inputs.validation_method }}
          CLEAR_LEAGUE_SETTINGS: ${{ inputs.clear_league_settings }}
        run: |
          set -euo pipefail
          # Empty League settings keep what is already deployed unless clearing was chosen explicitly.
          if [ "$CLEAR_LEAGUE_SETTINGS" != true ] && { [ -z "$LEAGUE_ADMIN_TOKEN" ] || [ -z "$LEAGUE_REMOVAL_URL" ]; }; then
            existing="$(az staticwebapp appsettings list -n "${{ vars.AZURE_STATIC_WEB_APP }}" -g "${{ vars.AZURE_RESOURCE_GROUP }}" -o json 2>/dev/null || true)"
            setting() { printf '%s' "$existing" | python3 -c 'import json,sys
          try: print((json.load(sys.stdin).get("properties") or {}).get(sys.argv[1]) or "")
          except Exception: print("")' "$1"; }
            if [ -z "$LEAGUE_ADMIN_TOKEN" ]; then
              LEAGUE_ADMIN_TOKEN="$(setting LEAGUE_ADMIN_TOKEN)"
              if [ -n "$LEAGUE_ADMIN_TOKEN" ]; then echo "::add-mask::$LEAGUE_ADMIN_TOKEN"; fi
            fi
            if [ -z "$LEAGUE_REMOVAL_URL" ]; then LEAGUE_REMOVAL_URL="$(setting LEAGUE_REMOVAL_URL)"; fi
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agent-ready-check-runner:latest"
          az deployment group create -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "gh-${{ github.run_id }}" -f infra/main.bicep \
            -p appName="${{ vars.AZURE_STATIC_WEB_APP }}" swaSku="${{ inputs.swa_sku }}" customDomain="$CUSTOM_DOMAIN" domainValidationMethod="$VALIDATION_METHOD" \
               deployBrowserRunner=${{ inputs.browser_runner }} runnerImage="$image" \
               leagueAdminToken="$LEAGUE_ADMIN_TOKEN" leagueRemovalUrl="$LEAGUE_REMOVAL_URL" \
            --query properties.outputs -o json | tee outputs.json
          origin="$(python3 -c "import json;print(json.load(open('outputs.json'))['publicOrigin']['value'])")"
          echo "Public origin: $origin. If it changed, set the PUBLIC_BASE_URL variable to it and re-run Deploy to Azure." >> "$GITHUB_STEP_SUMMARY"
